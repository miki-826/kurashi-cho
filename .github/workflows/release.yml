name: Android Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/household-release-key.jks
      - name: Build signed APKs
        env:
          HOUSEHOLD_STORE_FILE: app/household-release-key.jks
          HOUSEHOLD_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          HOUSEHOLD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          HOUSEHOLD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk household-ai-universal.apk
          flutter build apk --release --target-platform android-arm64 --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk household-ai-arm64-v8a.apk
          sha256sum household-ai-universal.apk household-ai-arm64-v8a.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            household-ai-universal.apk
            household-ai-arm64-v8a.apk
            SHA256SUMS.txt
